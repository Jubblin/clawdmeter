# SonarCloud automatic analysis config.
#
# esphome/components/clawd_app/vendored/ is a mechanical copy of
# firmware/src/ — the ESPHome build can only pick up sources that sit inside
# the external component's own directory, so the application code has to be
# duplicated there rather than referenced. Sonar already analyses the
# originals under firmware/src/, so scanning the copies only reports every
# issue twice and pins new-code duplication at ~60%.
#
# The two files here that are genuinely new rather than copied —
# boards/*/display.cpp, the ESPHome display_hal adapters — are excluded too,
# for the sake of one honest rule rather than a hand-maintained list; they're
# deliberately written in the same style as the firmware driver they replace.
sonar.exclusions=esphome/components/clawd_app/vendored/**
