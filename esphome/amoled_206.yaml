# Waveshare ESP32-S3-Touch-AMOLED-2.06 — ESPHome build.
#
# See esphome/README.md for the full picture: this device's application
# logic (BLE data channel + HID keyboard, LVGL UI, splash animations, idle/
# brightness, usage-rate tracking) is vendored close to verbatim from
# firmware/src/ under components/clawd_app/vendored/ — read that README
# before touching this file. Panel bring-up (QSPI bus, CO5300 init
# sequence, the col_offset1=23 viewport-centering fix) is delegated to
# ESPHome's own `mipi_spi` component via a small model patch — see
# esphome/patches/README.md. Run esphome/patches/apply.sh before every
# compile/run until that model is upstreamed.
#
# NOT YET VERIFIED ON HARDWARE. See esphome/README.md's "Status" section.

esphome:
  name: clawdmeter-206
  friendly_name: Clawdmeter
  # NimBLE-Arduino/XPowersLib/SensorLib are Arduino-only, so this build stays
  # on the arduino framework component (like the rest of firmware/) rather
  # than esp-idf — see esphome/README.md for why that's the lower-risk
  # choice for this migration.
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    upload_speed: "921600"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  framework:
    # No version/platform_version pin: recent ESPHome builds the Arduino core
    # as an ESP-IDF component and fetches a matching IDF tarball from its own
    # mirror, so pinning a pioarduino platform here just asks for an IDF
    # release that mirror doesn't carry.
    type: arduino
    sdkconfig_options:
      # NimBLE-Arduino compiles to nothing (and errors on bare `#if
      # CONFIG_BT_ENABLED`) unless the IDF Bluetooth controller + NimBLE host
      # are enabled in sdkconfig. The vendored app is a BLE peripheral only.
      CONFIG_BT_ENABLED: y
      CONFIG_BT_CONTROLLER_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: y
      CONFIG_BT_BLUEDROID_ENABLED: n
    advanced:
      # OTA on >16MB flash needs IDF's experimental large-flash support; the
      # board ships 32MB (default_32MB.csv in the PlatformIO build).
      enable_idf_experimental_features: true
  variant: esp32s3

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

# Network stack: this is the half of the migration the PlatformIO firmware
# can't do — Home Assistant/MQTT as the data path, plus OTA so a flashed
# board never needs the USB cable again. Copy secrets.yaml.example to
# secrets.yaml (gitignored) before building. WiFi coexists with the
# vendored NimBLE peripheral on the S3's shared radio; this has not been
# validated on hardware yet (see README.md's "Status").
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [clawd_app]

spi:
  type: quad
  clk_pin: GPIO11
  data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: clawd_display
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-2.06
    # cs_pin/reset_pin/dimensions/offset are all set by the model (see
    # esphome/patches/clawdmeter_amoled_206_model.py) — repeated here only
    # where it aids readability; remove if the model already covers it and
    # esphome complains about a duplicate/overridden key.
    update_interval: never # the vendored app pushes pixels via draw_pixels_at
                            # from its own LVGL flush callback — ESPHome
                            # never needs to auto-render this display.
    show_test_card: false

clawd_app:
  display_id: clawd_display

# --- Direct GPIOs the vendored app owns itself (Wire.begin, touch reset,
# BOOT button, PKEY-via-I2C for PWR) --------------------------------------
# These are NOT declared as ESPHome `i2c:`/`binary_sensor:`/`gpio:` entities
# on purpose: vendored/boards/waveshare_amoled_206/{board_init,touch,power,
# input}.cpp already do their own Wire.begin()/pinMode()/digitalRead() calls
# exactly as the plain PlatformIO firmware does (see esphome/README.md).
# Declaring the same pins again as ESPHome components would just fight the
# vendored code for ownership of the bus/pins.
