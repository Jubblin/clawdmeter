name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - waveshare_amoled_216
          - waveshare_amoled_18
          - waveshare_amoled_216_c6
          - waveshare_amoled_18_c6
          - waveshare_amoled_206
          - waveshare_lcd_154
          - waveshare_lcd_4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

  host:
    name: simulator + host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-host-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-host-
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: pip install platformio
      - run: pio test -d firmware -e native
      - run: pio run -d firmware -e sim
      - name: headless render smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SIM_AUTOSHOT_MS: '6000'
          SIM_AUTOSHOT_PATH: sim-autoshot.bmp
        run: |
          cd firmware
          timeout 60 .pio/build/sim/program
          test -s sim-autoshot.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: sim-autoshot
          path: firmware/sim-autoshot.bmp

  esphome:
    name: esphome build (amoled_206)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # esphome 2026.8 requires >=3.12
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio/.cache
          key: esphome-206-${{ hashFiles('esphome/amoled_206.yaml') }}
          restore-keys: esphome-206-
      # wheels only, so no dependency's setup.py runs; the three exceptions
      # ship sdist-only at the versions esphome pins.
      - run: >-
          pip install --only-binary :all:
          --no-binary paho-mqtt,esptool,crcmod esphome==2026.8.2
      - name: register the CO5300 2.06 panel model
        run: esphome/patches/apply.sh "$(which python3)"
      - name: throwaway secrets (wifi/api/ota keys are per-device)
        run: |
          key=$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')
          printf 'wifi_ssid: clawdmeter-ci\nwifi_password: ci-placeholder\napi_encryption_key: %s\nota_password: ci-placeholder\n' \
            "$key" > esphome/secrets.yaml
      - run: esphome compile esphome/amoled_206.yaml

  daemon:
    name: daemon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: daemon/requirements*.txt
      - run: pip install -r daemon/requirements-dev.txt
      - run: pytest -q
